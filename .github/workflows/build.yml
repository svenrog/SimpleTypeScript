name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      # Both, because the packages target both and the test project runs on each — without the 8.0 runtime
      # here, half the matrix is built and never executed.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SimpleTypeScript.slnx

      # Catches formatting/style drift that has no compiler diagnostic of its own
      # (whitespace, etc.) and so wouldn't otherwise fail the Build step below.
      - name: Format check
        run: dotnet format SimpleTypeScript.slnx --verify-no-changes

      # ContinuousIntegrationBuild here as well as in release.yml, because it is not inert: it normalizes
      # source paths, and a test that reads this repository's own files has to find them without one. A
      # release is the wrong place to discover that, since the tag is already pushed by then.
      - name: Build
        run: dotnet build SimpleTypeScript.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test SimpleTypeScript.slnx -c Release --no-build

      # The emitter's AOT claim, published rather than asserted. IsAotCompatible turns on the trim and AOT
      # analyzers, which the build above already fails on; what only a publish says is that the result links
      # and runs. Its own RID, so no cross-compilation toolchain is in the way of the answer.
      - name: Publish AOT (proves the emitter's claim)
        run: dotnet publish tests/SimpleTypeScript.AotConsumer -c Release -r linux-x64

      # Pack on every PR as a validation gate; artifacts are not published here.
      - name: Pack (validation)
        run: dotnet pack SimpleTypeScript.slnx -c Release --no-build -o artifacts/pkg
